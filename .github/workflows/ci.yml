name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # 发布 Release 需要写权限

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK(按 global.json)
        uses: actions/setup-dotnet@v4

      - name: 还原依赖
        run: dotnet restore "DSH Launcher.slnx"

      - name: 构建
        run: dotnet build "DSH Launcher.slnx" --no-restore -c Release

      - name: 测试
        run: dotnet test "DSH Launcher.Tests" --no-build -c Release

  # 打 tag(如 v1.2.0)时额外构建安装包并上传为 Artifact
  installer:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK(按 global.json)
        uses: actions/setup-dotnet@v4

      - name: 安装 Inno Setup
        run: choco install innosetup --no-progress -y

      - name: 构建安装包
        run: ./Build-Installer.ps1

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: Setup/*.exe
          if-no-files-found: error

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Setup/*.exe
          generate_release_notes: true
