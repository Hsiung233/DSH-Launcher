name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]   # tags 必须单独列出:branches 过滤器不包含 tag,否则打 tag 不会触发发布
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # 发布 Release 需要写权限

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK(按 global.json)
        uses: actions/setup-dotnet@v4

      - name: 还原依赖
        run: dotnet restore "DSH Launcher.slnx"

      - name: 构建
        run: dotnet build "DSH Launcher.slnx" --no-restore -c Release

      # 测试项目不在 .slnx 里(见 slnx 内的说明),必须单独构建;
      # 不构建的话 dotnet test --no-build 会静默匹配 0 个测试文件而"假通过"。
      - name: 构建测试项目
        run: dotnet build "DSH Launcher.Tests/DSH Launcher.Tests.csproj" -c Release

      - name: 测试
        run: dotnet test "DSH Launcher.Tests/DSH Launcher.Tests.csproj" -c Release --no-build --nologo

  # 打 tag(如 v1.2.0)时额外构建安装包并上传为 Artifact
  installer:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK(按 global.json)
        uses: actions/setup-dotnet@v4

      - name: 安装 Inno Setup
        run: choco install innosetup --no-progress -y

      # 校验 tag 与程序集版本一致(如 v1.0.1 ↔ csproj <Version>1.0.1</Version>),
      # 防止安装包 AppVersion 与 Release 版本号对不上。
      - name: 校验 tag 与应用版本一致
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $exe = Join-Path "DSH Launcher" "bin\Publish\DSH Launcher_Windows_x64\DSH Launcher.exe"
          if (-not (Test-Path $exe)) { throw "找不到发布产物 $exe(发布步骤未执行?)" }
          $ver = (Get-Item $exe).VersionInfo.FileVersion
          Write-Host "tag=$tag exe=$ver"
          if ($ver -ne $tag) { throw "tag(v$tag) 与应用版本($ver)不一致。请同步修改 csproj 的 <Version> 后重新打 tag。" }

      - name: 构建安装包
        run: ./Build-Installer.ps1

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: Setup/*.exe
          if-no-files-found: error

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Setup/*.exe
          generate_release_notes: true
